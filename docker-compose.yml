volumes:
  auth_postgres_data: {}
  auth_postgres_data_backups: {}

services:
  api:
    build: .
    ports:
      - "8014:8080"
    environment:
      - ConnectionStrings__Postgres=Server=postgres;Port=5432;Database=${POSTGRES_DB};User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
    depends_on:
      - management

  management:
    build:
      context: .
      dockerfile: Dockerfile.Management
    ports:
      - "8015:8080"
    environment:
      - ConnectionStrings__Postgres=Server=postgres;Port=5432;Database=${POSTGRES_DB};User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
      - RunMigrations=true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    hostname: postgres
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/docker
      - auth_postgres_data_backups:/backups
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15