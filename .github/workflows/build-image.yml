name: Build and push docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        uses: actions/checkout@v7

      - id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - id: dotnet-test
        run: dotnet test ./src/IIIFAuth2/ /p:Configuration=Release --verbosity normal

  build-push:
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image: ghcr.io/dlcs/iiif-auth-2
          - dockerfile: Dockerfile.Management
            image: ghcr.io/dlcs/iiif-auth-2-management

    steps:
      - id: checkout
        uses: actions/checkout@v7

      - id: buildx        
        uses: docker/setup-buildx-action@v4

      - id: docker-meta        
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - id: docker-cache
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.dockerfile }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.dockerfile }}-

      - id: ghcr-login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          builder: ${{ steps.buildx.outputs.name }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          push: ${{ github.actor != 'dependabot[bot]' }}